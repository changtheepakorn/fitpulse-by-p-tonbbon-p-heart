<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภารกิจจัดการเวลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f4; --card: #ffffff; --ink: #1e2b26; --ink-soft: #5a6b64; --ink-faint: #93a29c;
    --accent: #2f6f5e; --accent-soft: #e1ece7;
    --border: rgba(30,43,38,0.10); --border-strong: rgba(30,43,38,0.18); --done: #c7d4cd;
  }
  [data-theme="dark"] {
    --bg: #121815; --card: #182019; --ink: #eef2f0; --ink-soft: #a8b5ae; --ink-faint: #6b7a73;
    --accent: #6fbfa4; --accent-soft: #1f2f28;
    --border: rgba(238,242,240,0.10); --border-strong: rgba(238,242,240,0.18); --done: #33403a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --card: #182019; --ink: #eef2f0; --ink-soft: #a8b5ae; --ink-faint: #6b7a73;
      --accent: #6fbfa4; --accent-soft: #1f2f28;
      --border: rgba(238,242,240,0.10); --border-strong: rgba(238,242,240,0.18); --done: #33403a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans Thai', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }

  header { margin-bottom: 1.5rem; }
  .eyebrow { font-size: 13px; color: var(--ink-faint); margin: 0 0 4px; }
  h1 { font-family: 'Noto Serif Thai', serif; font-weight: 600; font-size: 24px; margin: 0; }
  .date-line { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.35s ease; }

  button.ghost {
    background: transparent; border: 1px solid var(--border-strong); color: var(--ink-soft);
    font-family: inherit; font-size: 13px; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  }
  button.ghost:active { background: var(--accent-soft); }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-primary:active { opacity: 0.85; }

  .hint { font-size: 12.5px; color: var(--ink-faint); margin: 8px 2px 0; line-height: 1.5; }

  /* Cumulative progress */
  .progress-card { padding: 1.25rem 1.25rem 1.4rem; margin-bottom: 1.5rem; }
  .progress-top-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  .progress-big { font-family: 'Noto Serif Thai', serif; font-size: 34px; font-weight: 600; color: var(--accent); line-height: 1; }
  .progress-big.small { font-size: 24px; text-align: right; }
  .progress-lbl { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .streak-box { text-align: right; }
  .milestone-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  #milestone-label { font-weight: 500; color: var(--ink); }
  .today-count { font-size: 13px; color: var(--ink-soft); margin: 12px 2px 0; }
  .today-count b { color: var(--accent); font-weight: 600; }

  /* Choose */
  .choose-heading { font-size: 15px; font-weight: 500; margin: 0 2px 10px; }
  #mission-suggest-list { margin-bottom: 10px; }
  .suggest-item {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14.5px; line-height: 1.5;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:active { background: var(--accent-soft); }
  .suggest-item .arrow { margin-inline-start: auto; color: var(--ink-faint); flex-shrink: 0; }
  .reroll-row { display: flex; justify-content: center; margin-bottom: 1.25rem; }
  .or-divider { display: flex; align-items: center; gap: 10px; margin: 1.25rem 0; color: var(--ink-faint); font-size: 12.5px; }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .custom-mission-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .describe-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 0; }
  .describe-card textarea, .custom-mission-card textarea {
    font-family: inherit; font-size: 14px; padding: 12px; border: 1px solid var(--border-strong);
    border-radius: 10px; background: var(--bg); color: var(--ink); min-height: 70px; resize: vertical;
  }
  .describe-card button, .custom-mission-card button { align-self: flex-end; }
  .ai-status { font-size: 12.5px; color: var(--ink-faint); margin: 0; min-height: 16px; }

  /* Assigned mission */
  .mission-card { padding: 2rem 1.5rem; text-align: center; }
  .mission-eyebrow { font-size: 13px; color: var(--ink-faint); margin-bottom: 14px; }
  .mission-text { font-family: 'Noto Serif Thai', serif; font-size: 20px; font-weight: 600; line-height: 1.6; margin-bottom: 1.75rem; }
  .mission-btn { width: 100%; padding: 13px; font-size: 15px; }

  /* Today's log of completed rounds */
  .done-list { margin-top: 1.5rem; }
  .done-list-head { font-size: 13px; color: var(--ink-soft); margin: 0 2px 10px; }
  .done-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .done-item:last-child { border-bottom: none; }
  .done-item .tick { color: var(--accent); flex-shrink: 0; margin-top: 1px; }
  .done-item .txt { font-size: 14px; line-height: 1.5; color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--done); }
</style>
</head>
<body>

<!-- Top Navigation Bar to Portal -->
<div id="student-portal-floating-bar" style="position:fixed; top:12px; left:12px; z-index:99999; display:flex; gap:8px;">
  <a href="index.html" style="background:rgba(15, 23, 42, 0.9); color:#38bdf8; border:1px solid rgba(56, 189, 248, 0.4); backdrop-filter:blur(10px); padding:8px 14px; border-radius:12px; font-family:'Kanit', sans-serif; font-size:12px; font-weight:600; text-decoration:none; display:flex; align-items:center; gap:6px; box-shadow:0 4px 15px rgba(0,0,0,0.5); transition:transform 0.15s ease;">
    <span>◀</span>
    <span>กลับหน้ารวมผลงานนักเรียน</span>
  </a>
</div>


<div class="wrap">

  <header>
    <p class="eyebrow">ภารกิจจัดการเวลา</p>
    <h1>ทำทีละน้อย สะสมไปเรื่อยๆ</h1>
    <p class="date-line" id="date-line"></p>
  </header>

  <div class="card progress-card">
    <div class="progress-top-row">
      <div>
        <div class="progress-big" id="prog-total">0</div>
        <div class="progress-lbl">ภารกิจสะสมทั้งหมด</div>
      </div>
      <div class="streak-box">
        <div class="progress-big small" id="prog-streak">0</div>
        <div class="progress-lbl">วันติดต่อกัน</div>
      </div>
    </div>
    <div class="milestone-row">
      <span id="milestone-label">เริ่มต้นสร้างนิสัย</span>
      <span id="milestone-target"></span>
    </div>
    <div class="track"><div class="fill" id="milestone-fill"></div></div>
    <div class="today-count">วันนี้ทำไปแล้ว <b id="today-count-num">0</b> ภารกิจ</div>
  </div>

  <div id="mission-choose-wrap">
    <p class="choose-heading">บอกมาว่าตอนนี้เป็นยังไงบ้าง</p>
    <div class="card describe-card">
      <textarea id="state-input" placeholder="เช่น วันนี้งานเยอะมาก เพิ่งตื่นสายเลยรู้สึกเวลาไม่พอ หรือกำลังผัดวันงานที่ค้างอยู่" maxlength="300"></textarea>
      <button class="btn-primary" id="ai-suggest-btn">ให้แนะนำภารกิจ</button>
      <p class="ai-status" id="ai-status"></p>
    </div>
    <div class="or-divider"><span>หรือ</span></div>
    <div class="card custom-mission-card">
      <textarea id="mission-custom-text" placeholder="กำหนดภารกิจของตัวเองเลย เช่น วันนี้จะไม่เช็คมือถือก่อน 9 โมง" maxlength="140"></textarea>
      <button class="btn-primary" id="mission-custom-submit">ใช้ภารกิจนี้</button>
    </div>
  </div>

  <div class="card mission-card" id="mission-card" style="display:none;">
    <div class="mission-eyebrow" id="mission-eyebrow">ภารกิจตอนนี้</div>
    <div class="mission-text" id="mission-text"></div>
    <button class="btn-primary mission-btn" id="mission-btn">ทำแล้ว</button>
  </div>
  <p class="hint">ทำเสร็จแล้วเลือกภารกิจถัดไปได้ทันที ทำได้ไม่จำกัดจำนวนรอบต่อวัน</p>

  <div class="done-list" id="done-list" style="display:none;">
    <p class="done-list-head">ภารกิจที่ทำแล้ววันนี้</p>
    <div class="card" id="done-list-items"></div>
  </div>

</div>

<script>
/* ---------- shared helpers ---------- */
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function loadDay(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.date === todayKey()) return parsed.data;
    }
  } catch (e) {}
  return fallback;
}
function saveDay(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ date: todayKey(), data })); } catch (e) {}
}
function loadPersist(key, fallback) {
  try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch (e) {}
  return fallback;
}
function savePersist(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
}

const daysTh = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const monthsTh = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
(function setDateLine() {
  const now = new Date();
  document.getElementById('date-line').textContent =
    'วัน' + daysTh[now.getDay()] + 'ที่ ' + now.getDate() + ' ' + monthsTh[now.getMonth()] + ' ' + (now.getFullYear() + 543);
})();

/* ---------- AI-suggested mission (via sample capability) ---------- */
let sampleApi = null;
let sampleReady = false;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(s => { sampleApi = s; sampleReady = true; });
} else {
  sampleReady = true;
}

/* ---------- cumulative stats (persistent) ---------- */
const MISSION_STATS_KEY = 'th-mission-stats';
let missionStats = loadPersist(MISSION_STATS_KEY, { total: 0, streak: 0, longest: 0, lastDate: null });
const MILESTONES = [
  { at: 7,   label: "เริ่มติดเป็นนิสัย" },
  { at: 14,  label: "แข็งแรงขึ้นเรื่อยๆ" },
  { at: 30,  label: "นิสัยเริ่มมั่นคง" },
  { at: 60,  label: "ทำได้อย่างเป็นธรรมชาติ" },
  { at: 100, label: "ผู้เชี่ยวชาญด้านวินัย" },
  { at: 200, label: "มาสเตอร์การจัดการเวลา" },
  { at: 365, label: "ทำมาแล้วทั้งปี" }
];
function recordMissionCompletion() {
  const today = todayKey();
  missionStats.total += 1;
  if (missionStats.lastDate !== today) {
    missionStats.streak = (missionStats.lastDate === yesterdayKey()) ? missionStats.streak + 1 : 1;
    missionStats.longest = Math.max(missionStats.longest, missionStats.streak);
    missionStats.lastDate = today;
  }
  savePersist(MISSION_STATS_KEY, missionStats);
}
function renderProgressCard() {
  document.getElementById('prog-total').textContent = missionStats.total;
  document.getElementById('prog-streak').textContent = missionStats.streak;

  let prevAt = 0, currentLabel = "เริ่มต้นสร้างนิสัย", nextAt = MILESTONES[0].at;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (missionStats.total >= MILESTONES[i].at) {
      prevAt = MILESTONES[i].at;
      currentLabel = MILESTONES[i].label;
      nextAt = MILESTONES[i+1] ? MILESTONES[i+1].at : null;
    }
  }
  document.getElementById('milestone-label').textContent = currentLabel;
  if (nextAt) {
    const span = nextAt - prevAt;
    const pct = Math.min(100, Math.round((missionStats.total - prevAt) / span * 100));
    document.getElementById('milestone-fill').style.width = pct + '%';
    document.getElementById('milestone-target').textContent = missionStats.total + ' / ' + nextAt;
  } else {
    document.getElementById('milestone-fill').style.width = '100%';
    document.getElementById('milestone-target').textContent = 'สูงสุดแล้ว';
  }
  document.getElementById('today-count-num').textContent = (dayState.completedToday || []).length;
}

/* ---------- today's state: stage + completed rounds ---------- */
const MISSION_DAY_KEY = 'th-mission-day-v3';
// stage: 'choose' | 'assigned'
let dayState = loadDay(MISSION_DAY_KEY, { stage: 'choose', current: null, completedToday: [] });
if (!dayState || typeof dayState !== 'object') dayState = { stage: 'choose', current: null, completedToday: [] };
if (!Array.isArray(dayState.completedToday)) dayState.completedToday = [];
if (dayState.stage === 'assigned' && (!dayState.current || !dayState.current.text)) dayState.stage = 'choose';

document.getElementById('ai-suggest-btn').addEventListener('click', async () => {
  const input = document.getElementById('state-input');
  const status = document.getElementById('ai-status');
  const btn = document.getElementById('ai-suggest-btn');
  const desc = input.value.trim();
  if (!desc) { input.focus(); return; }

  if (!sampleApi) {
    status.textContent = 'ฟีเจอร์แนะนำภารกิจใช้ไม่ได้ตอนนี้ ลองกำหนดภารกิจเองด้านล่างแทนนะ';
    return;
  }
  btn.disabled = true;
  status.textContent = 'กำลังคิดภารกิจให้...';
  try {
    const prompt = 'คุณเป็นโค้ชด้านการจัดการเวลา ผู้ใช้จะอธิบายว่าตอนนี้ตัวเองเป็นอย่างไร ' +
      'ให้คุณตอบกลับเป็น "ภารกิจเล็กๆ 1 อย่าง" ที่ทำได้ภายในวันนี้ ใช้เวลาไม่กี่นาทีถึงไม่กี่สิบนาที ' +
      'เกี่ยวกับการจัดการเวลาโดยตรง เขียนเป็นประโยคคำสั่งสั้นๆ ภาษาไทย ไม่เกิน 20 คำ ' +
      'ตอบกลับมาแค่ประโยคภารกิจเดียวเท่านั้น ห้ามมีคำอธิบายเพิ่มหรือหัวข้อนำ\n\n' +
      'ผู้ใช้บอกว่า: ' + desc;
    const result = await sampleApi(prompt, { modelTier: 'quick' });
    const text = (result && result.text ? result.text : '').trim().replace(/^["'“]|["'”]$/g, '');
    if (!text) throw new Error('empty');
    dayState.current = { text: text, source: 'ai' };
    dayState.stage = 'assigned';
    saveDay(MISSION_DAY_KEY, dayState);
    input.value = '';
    status.textContent = '';
    render();
  } catch (e) {
    status.textContent = 'ขอภารกิจไม่สำเร็จ ลองอีกครั้ง หรือกำหนดภารกิจเองด้านล่าง';
  } finally {
    btn.disabled = false;
  }
});
document.getElementById('mission-custom-submit').addEventListener('click', () => {
  const input = document.getElementById('mission-custom-text');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  dayState.current = { text: text, source: 'custom' };
  dayState.stage = 'assigned';
  saveDay(MISSION_DAY_KEY, dayState);
  input.value = '';
  render();
});
document.getElementById('mission-btn').addEventListener('click', () => {
  dayState.completedToday.push(dayState.current);
  recordMissionCompletion();
  dayState.stage = 'choose';
  dayState.current = null;
  saveDay(MISSION_DAY_KEY, dayState);
  render();
});

function render() {
  const chooseWrap = document.getElementById('mission-choose-wrap');
  const card = document.getElementById('mission-card');

  if (dayState.stage === 'choose') {
    chooseWrap.style.display = '';
    card.style.display = 'none';
  } else {
    chooseWrap.style.display = 'none';
    card.style.display = '';
    if (!dayState.current || !dayState.current.text) {
      dayState.stage = 'choose';
      saveDay(MISSION_DAY_KEY, dayState);
      return render();
    }
    document.getElementById('mission-text').textContent = dayState.current.text;
    const sourceLabel = dayState.current.source === 'custom' ? 'กำหนดเอง' : (dayState.current.source === 'ai' ? 'แนะนำให้ตามที่เล่ามา' : 'แนะนำให้');
    document.getElementById('mission-eyebrow').textContent = 'ภารกิจตอนนี้ · ' + sourceLabel;
  }

  const doneList = document.getElementById('done-list');
  const doneItems = document.getElementById('done-list-items');
  if (dayState.completedToday.length) {
    doneList.style.display = '';
    doneItems.innerHTML = '';
    [...dayState.completedToday].reverse().forEach(m => {
      const row = document.createElement('div');
      row.className = 'done-item';
      row.innerHTML = '<span class="tick">✓<!DOCTYPE html>

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.35s ease; }

  button.ghost {
    background: transparent; border: 1px solid var(--border-strong); color: var(--ink-soft);
    font-family: inherit; font-size: 13px; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  }
  button.ghost:active { background: var(--accent-soft); }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-primary:active { opacity: 0.85; }

  .hint { font-size: 12.5px; color: var(--ink-faint); margin: 8px 2px 0; line-height: 1.5; }

  /* Cumulative progress */
  .progress-card { padding: 1.25rem 1.25rem 1.4rem; margin-bottom: 1.5rem; }
  .progress-top-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  .progress-big { font-family: 'Noto Serif Thai', serif; font-size: 34px; font-weight: 600; color: var(--accent); line-height: 1; }
  .progress-big.small { font-size: 24px; text-align: right; }
  .progress-lbl { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .streak-box { text-align: right; }
  .milestone-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  #milestone-label { font-weight: 500; color: var(--ink); }
  .today-count { font-size: 13px; color: var(--ink-soft); margin: 12px 2px 0; }
  .today-count b { color: var(--accent); font-weight: 600; }

  /* Choose */
  .choose-heading { font-size: 15px; font-weight: 500; margin: 0 2px 10px; }
  #mission-suggest-list { margin-bottom: 10px; }
  .suggest-item {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14.5px; line-height: 1.5;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:active { background: var(--accent-soft); }
  .suggest-item .arrow { margin-inline-start: auto; color: var(--ink-faint); flex-shrink: 0; }
  .reroll-row { display: flex; justify-content: center; margin-bottom: 1.25rem; }
  .or-divider { display: flex; align-items: center; gap: 10px; margin: 1.25rem 0; color: var(--ink-faint); font-size: 12.5px; }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .custom-mission-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .describe-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 0; }
  .describe-card textarea, .custom-mission-card textarea {
    font-family: inherit; font-size: 14px; padding: 12px; border: 1px solid var(--border-strong);
    border-radius: 10px; background: var(--bg); color: var(--ink); min-height: 70px; resize: vertical;
  }
  .describe-card button, .custom-mission-card button { align-self: flex-end; }
  .ai-status { font-size: 12.5px; color: var(--ink-faint); margin: 0; min-height: 16px; }

  /* Assigned mission */
  .mission-card { padding: 2rem 1.5rem; text-align: center; }
  .mission-eyebrow { font-size: 13px; color: var(--ink-faint); margin-bottom: 14px; }
  .mission-text { font-family: 'Noto Serif Thai', serif; font-size: 20px; font-weight: 600; line-height: 1.6; margin-bottom: 1.75rem; }
  .mission-btn { width: 100%; padding: 13px; font-size: 15px; }

  /* Today's log of completed rounds */
  .done-list { margin-top: 1.5rem; }
  .done-list-head { font-size: 13px; color: var(--ink-soft); margin: 0 2px 10px; }
  .done-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .done-item:last-child { border-bottom: none; }
  .done-item .tick { color: var(--accent); flex-shrink: 0; margin-top: 1px; }
  .done-item .txt { font-size: 14px; line-height: 1.5; color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--done); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">ภารกิจจัดการเวลา</p>
    <h1>ทำทีละน้อย สะสมไปเรื่อยๆ</h1>
    <p class="date-line" id="date-line"></p>
  </header>

  <div class="card progress-card">
    <div class="progress-top-row">
      <div>
        <div class="progress-big" id="prog-total">0</div>
        <div class="progress-lbl">ภารกิจสะสมทั้งหมด</div>
      </div>
      <div class="streak-box">
        <div class="progress-big small" id="prog-streak">0</div>
        <div class="progress-lbl">วันติดต่อกัน</div>
      </div>
    </div>
    <div class="milestone-row">
      <span id="milestone-label">เริ่มต้นสร้างนิสัย</span>
      <span id="milestone-target"></span>
    </div>
    <div class="track"><div class="fill" id="milestone-fill"></div></div>
    <div class="today-count">วันนี้ทำไปแล้ว <b id="today-count-num">0</b> ภารกิจ</div>
  </div>

  <div id="mission-choose-wrap">
    <p class="choose-heading">บอกมาว่าตอนนี้เป็นยังไงบ้าง</p>
    <div class="card describe-card">
      <textarea id="state-input" placeholder="เช่น วันนี้งานเยอะมาก เพิ่งตื่นสายเลยรู้สึกเวลาไม่พอ หรือกำลังผัดวันงานที่ค้างอยู่" maxlength="300"></textarea>
      <button class="btn-primary" id="ai-suggest-btn">ให้แนะนำภารกิจ</button>
      <p class="ai-status" id="ai-status"></p>
    </div>
    <div class="or-divider"><span>หรือ</span></div>
    <div class="card custom-mission-card">
      <textarea id="mission-custom-text" placeholder="กำหนดภารกิจของตัวเองเลย เช่น วันนี้จะไม่เช็คมือถือก่อน 9 โมง" maxlength="140"></textarea>
      <button class="btn-primary" id="mission-custom-submit">ใช้ภารกิจนี้</button>
    </div>
  </div>

  <div class="card mission-card" id="mission-card" style="display:none;">
    <div class="mission-eyebrow" id="mission-eyebrow">ภารกิจตอนนี้</div>
    <div class="mission-text" id="mission-text"></div>
    <button class="btn-primary mission-btn" id="mission-btn">ทำแล้ว</button>
  </div>
  <p class="hint">ทำเสร็จแล้วเลือกภารกิจถัดไปได้ทันที ทำได้ไม่จำกัดจำนวนรอบต่อวัน</p>

  <div class="done-list" id="done-list" style="display:none;">
    <p class="done-list-head">ภารกิจที่ทำแล้ววันนี้</p>
    <div class="card" id="done-list-items"></div>
  </div>

</div>

<script>
/* ---------- shared helpers ---------- */
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function loadDay(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.date === todayKey()) return parsed.data;
    }
  } catch (e) {}
  return fallback;
}
function saveDay(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ date: todayKey(), data })); } catch (e) {}
}
function loadPersist(key, fallback) {
  try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch (e) {}
  return fallback;
}
function savePersist(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
}

const daysTh = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const monthsTh = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
(function setDateLine() {
  const now = new Date();
  document.getElementById('date-line').textContent =
    'วัน' + daysTh[now.getDay()] + 'ที่ ' + now.getDate() + ' ' + monthsTh[now.getMonth()] + ' ' + (now.getFullYear() + 543);
})();

/* ---------- AI-suggested mission (via sample capability) ---------- */
let sampleApi = null;
let sampleReady = false;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(s => { sampleApi = s; sampleReady = true; });
} else {
  sampleReady = true;
}

/* ---------- cumulative stats (persistent) ---------- */
const MISSION_STATS_KEY = 'th-mission-stats';
let missionStats = loadPersist(MISSION_STATS_KEY, { total: 0, streak: 0, longest: 0, lastDate: null });
const MILESTONES = [
  { at: 7,   label: "เริ่มติดเป็นนิสัย" },
  { at: 14,  label: "แข็งแรงขึ้นเรื่อยๆ" },
  { at: 30,  label: "นิสัยเริ่มมั่นคง" },
  { at: 60,  label: "ทำได้อย่างเป็นธรรมชาติ" },
  { at: 100, label: "ผู้เชี่ยวชาญด้านวินัย" },
  { at: 200, label: "มาสเตอร์การจัดการเวลา" },
  { at: 365, label: "ทำมาแล้วทั้งปี" }
];
function recordMissionCompletion() {
  const today = todayKey();
  missionStats.total += 1;
  if (missionStats.lastDate !== today) {
    missionStats.streak = (missionStats.lastDate === yesterdayKey()) ? missionStats.streak + 1 : 1;
    missionStats.longest = Math.max(missionStats.longest, missionStats.streak);
    missionStats.lastDate = today;
  }
  savePersist(MISSION_STATS_KEY, missionStats);
}
function renderProgressCard() {
  document.getElementById('prog-total').textContent = missionStats.total;
  document.getElementById('prog-streak').textContent = missionStats.streak;

  let prevAt = 0, currentLabel = "เริ่มต้นสร้างนิสัย", nextAt = MILESTONES[0].at;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (missionStats.total >= MILESTONES[i].at) {
      prevAt = MILESTONES[i].at;
      currentLabel = MILESTONES[i].label;
      nextAt = MILESTONES[i+1] ? MILESTONES[i+1].at : null;
    }
  }
  document.getElementById('milestone-label').textContent = currentLabel;
  if (nextAt) {
    const span = nextAt - prevAt;
    const pct = Math.min(100, Math.round((missionStats.total - prevAt) / span * 100));
    document.getElementById('milestone-fill').style.width = pct + '%';
    document.getElementById('milestone-target').textContent = missionStats.total + ' / ' + nextAt;
  } else {
    document.getElementById('milestone-fill').style.width = '100%';
    document.getElementById('milestone-target').textContent = 'สูงสุดแล้ว';
  }
  document.getElementById('today-count-num').textContent = (dayState.completedToday || []).length;
}

/* ---------- today's state: stage + completed rounds ---------- */
const MISSION_DAY_KEY = 'th-mission-day-v3';
// stage: 'choose' | 'assigned'
let dayState = loadDay(MISSION_DAY_KEY, { stage: 'choose', current: null, completedToday: [] });
if (!dayState || typeof dayState !== 'object') dayState = { stage: 'choose', current: null, completedToday: [] };
if (!Array.isArray(dayState.completedToday)) dayState.completedToday = [];
if (dayState.stage === 'assigned' && (!dayState.current || !dayState.current.text)) dayState.stage = 'choose';

document.getElementById('ai-suggest-btn').addEventListener('click', async () => {
  const input = document.getElementById('state-input');
  const status = document.getElementById('ai-status');
  const btn = document.getElementById('ai-suggest-btn');
  const desc = input.value.trim();
  if (!desc) { input.focus(); return; }

  if (!sampleApi) {
    status.textContent = 'ฟีเจอร์แนะนำภารกิจใช้ไม่ได้ตอนนี้ ลองกำหนดภารกิจเองด้านล่างแทนนะ';
    return;
  }
  btn.disabled = true;
  status.textContent = 'กำลังคิดภารกิจให้...';
  try {
    const prompt = 'คุณเป็นโค้ชด้านการจัดการเวลา ผู้ใช้จะอธิบายว่าตอนนี้ตัวเองเป็นอย่างไร ' +
      'ให้คุณตอบกลับเป็น "ภารกิจเล็กๆ 1 อย่าง" ที่ทำได้ภายในวันนี้ ใช้เวลาไม่กี่นาทีถึงไม่กี่สิบนาที ' +
      'เกี่ยวกับการจัดการเวลาโดยตรง เขียนเป็นประโยคคำสั่งสั้นๆ ภาษาไทย ไม่เกิน 20 คำ ' +
      'ตอบกลับมาแค่ประโยคภารกิจเดียวเท่านั้น ห้ามมีคำอธิบายเพิ่มหรือหัวข้อนำ\n\n' +
      'ผู้ใช้บอกว่า: ' + desc;
    const result = await sampleApi(prompt, { modelTier: 'quick' });
    const text = (result && result.text ? result.text : '').trim().replace(/^["'“]|["'”]$/g, '');
    if (!text) throw new Error('empty');
    dayState.current = { text: text, source: 'ai' };
    dayState.stage = 'assigned';
    saveDay(MISSION_DAY_KEY, dayState);
    input.value = '';
    status.textContent = '';
    render();
  } catch (e) {
    status.textContent = 'ขอภารกิจไม่สำเร็จ ลองอีกครั้ง หรือกำหนดภารกิจเองด้านล่าง';
  } finally {
    btn.disabled = false;
  }
});
document.getElementById('mission-custom-submit').addEventListener('click', () => {
  const input = document.getElementById('mission-custom-text');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  dayState.current = { text: text, source: 'custom' };
  dayState.stage = 'assigned';
  saveDay(MISSION_DAY_KEY, dayState);
  input.value = '';
  render();
});
document.getElementById('mission-btn').addEventListener('click', () => {
  dayState.completedToday.push(dayState.current);
  recordMissionCompletion();
  dayState.stage = 'choose';
  dayState.current = null;
  saveDay(MISSION_DAY_KEY, dayState);
  render();
});

function render() {
  const chooseWrap = document.getElementById('mission-choose-wrap');
  const card = document.getElementById('mission-card');

  if (dayState.stage === 'choose') {
    chooseWrap.style.display = '';
    card.style.display = 'none';
  } else {
    chooseWrap.style.display = 'none';
    card.style.display = '';
    if (!dayState.current || !dayState.current.text) {
      dayState.stage = 'choose';
      saveDay(MISSION_DAY_KEY, dayState);
      return render();
    }
    document.getElementById('mission-text').textContent = dayState.current.text;
    const sourceLabel = dayState.current.source === 'custom' ? 'กำหนดเอง' : (dayState.current.source === 'ai' ? 'แนะนำให้ตามที่เล่ามา' : 'แนะนำให้');
    document.getElementById('mission-eyebrow').textContent = 'ภารกิจตอนนี้ · ' + sourceLabel;
  }

  const doneList = document.getElementById('done-list');
  const doneItems = document.getElementById('done-list-items');
  if (dayState.completedToday.length) {
    doneList.style.display = '';
    doneItems.innerHTML = '';
    [...dayState.completedToday].reverse().forEach(m => {
      const row = document.createElement('div');
      row.className = 'done-item';
      row.innerHTML = '<span class="tick">✓</span><span class="txt"></span>';
      row.querySelector('.txt').textContent = m.text;
      doneItems.appendChild(row);
    });
  } else {
    doneList.style.display = 'none';
  }

  renderProgressCard();
}
render();
</script>
</body>
</html>
