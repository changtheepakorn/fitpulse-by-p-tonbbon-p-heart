<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUN ARCADE - รวม 10 เกมสนุกๆ</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Kanit', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      background-attachment: fixed;
      color: #fff;
    }

    /* ดาวพื้นหลัง */
    .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 2.6s ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: 0.15; transform: scale(0.7); } to { opacity: 0.9; transform: scale(1.2); } }

    .arcade-shell {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 980px;
    }

    .top-controls {
      position: absolute; top: 15px; right: 15px; display: flex;
      gap: 10px; z-index: 100; flex-wrap: wrap; justify-content: flex-end;
    }
    .control-btn {
      background: rgba(0, 0, 0, 0.85); border: 2px solid #fbf236; color: #fff;
      padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      font-family: 'Kanit', sans-serif; font-weight: bold; text-decoration: none; display: inline-block;
    }
    .control-btn:hover { background: #333; }
    /* ชิปผู้ใช้ + ปุ่มออกจากระบบ */
    .user-chip {
      background: rgba(0, 0, 0, 0.85); border: 2px solid #6abe30; color: #fff;
      padding: 8px 14px; border-radius: 20px; font-size: 12px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      font-family: 'Kanit', sans-serif; font-weight: bold; display: inline-block;
      max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .logout-btn { border-color: #ef5350; }
    .logout-btn:hover { background: #b71c1c; }

    .arcade-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 22px;
      color: #fbf236;
      text-align: center;
      text-shadow: 3px 3px 0px #000;
      line-height: 1.6;
      margin: 0 0 8px;
    }
    .arcade-subtitle {
      color: #cbdbfc; font-size: 15px; margin-bottom: 26px;
      text-shadow: 1px 1px 3px #000; text-align: center;
    }

    .best-strip { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .best-chip {
      background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #ffd97a; font-weight: bold;
    }
    .best-chip b { color: #99e550; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }
    .game-tile {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 18px 12px 14px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    .game-tile:hover { transform: translate(-3px, -3px); border-color: #fbf236; }
    .tile-emoji { font-size: 44px; display: block; margin-bottom: 8px; }
    .tile-name {
      font-family: 'Press Start 2P', cursive; font-size: 10px; line-height: 1.7;
      color: #cbdbfc; display: block; min-height: 34px;
    }
    .tile-hint { font-size: 11px; color: #8a8070; display: block; margin-top: 4px; }
    .tile-best { font-size: 11px; color: #ffd97a; font-weight: bold; display: block; margin-top: 6px; min-height: 16px; }

    /* ---------- หน้าเล่นเกม ---------- */
    .play-wrap { display: none; }
    .play-wrap.active { display: block; }
    .menu-wrap.hidden { display: none; }

    .play-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px; color: #fbf5ef; text-align: center;
      margin: 0 0 6px; text-shadow: 3px 3px 0px #000; line-height: 1.5;
    }
    .play-howto {
      text-align: center; color: #ffd97a; font-size: 13px; margin-bottom: 12px;
      text-shadow: 1px 1px 2px #000;
    }
    .play-hud {
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      margin-bottom: 10px; font-size: 14px; font-weight: bold;
    }
    .hud-chip { background: rgba(0,0,0,0.5); border: 2px solid #000; border-radius: 8px; padding: 6px 14px; }
    .hud-chip span { color: #99e550; }

    .stage-zone { display: flex; justify-content: center; margin-bottom: 14px; }
    canvas.game-canvas {
      background: #0b0b14;
      border: 3px solid #000;
      border-radius: 10px;
      box-shadow: 4px 4px 0px #000, 0 0 24px rgba(91, 110, 225, 0.25);
      max-width: 100%;
      touch-action: none;
    }

    .play-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .btn {
      background-color: #5b6ee1; color: #ffffff; border: 2px solid #000;
      font-family: 'Press Start 2P', 'Kanit', sans-serif; font-size: 11px;
      padding: 12px 18px; cursor: pointer; box-shadow: 4px 4px 0px #000;
      text-shadow: 1px 1px 0px #000; border-radius: 6px; transition: all 0.1s ease;
    }
    .btn:hover { background-color: #639bff; transform: translate(-2px, -2px); }
    .btn.green { background-color: #6abe30; }
    .btn.green:hover { background-color: #99e550; }
    .btn.orange { background-color: #df7126; }
    .btn.orange:hover { background-color: #d9a066; }
    .btn.gray {
      background-color: rgba(50, 60, 57, 0.85);
      font-family: 'Kanit', sans-serif; font-size: 13px; box-shadow: 2px 2px 0px #000;
    }

    /* ปุ่มสัมผัสสำหรับมือถือ */
    .touch-pad { display: none; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .touch-pad.show { display: flex; }
    .tbtn {
      width: 56px; height: 48px; font-size: 20px; border-radius: 10px;
      background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #fbf236; cursor: pointer;
      user-select: none; -webkit-user-select: none; touch-action: none;
      font-family: 'Kanit', sans-serif;
    }
    .tbtn:active { background: #5b6ee1; }
    .tbtn.wide { width: 130px; font-size: 15px; font-weight: bold; }

    .mobile-note { text-align: center; color: #8a8070; font-size: 12px; margin-top: 8px; min-height: 18px; }
    .hub-footer { margin-top: 26px; color: #8a8070; font-size: 12px; text-align: center; }
    .hidden { display: none !important; }

    /* ---------- เกมจับคู่ ---------- */
    .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(420px, 92vw); margin: 0 auto; }
    .mem-card { aspect-ratio: 3/4; perspective: 600px; cursor: pointer; }
    .mem-inner { position: relative; width: 100%; height: 100%; transition: transform 0.35s; transform-style: preserve-3d; }
    .mem-card.flipped .mem-inner, .mem-card.matched .mem-inner { transform: rotateY(180deg); }
    .mem-face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; border: 2px solid #000; box-shadow: 2px 2px 0 #000;
    }
    .mem-back { background: linear-gradient(135deg, #3f3f74, #5b6ee1); color: #ffd97a; font-size: 20px; }
    .mem-front { background: #fdfbf3; transform: rotateY(180deg); }
    .mem-card.matched .mem-front { background: #dcfce7; border-color: #22c55e; }
    .mem-card.shake .mem-inner { animation: memShake 0.4s ease; }
    @keyframes memShake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-5px); }
      75% { transform: rotateY(180deg) translateX(5px); }
    }

    /* ---------- เกม 2048 ---------- */
    .g2048-wrap { width: min(420px, 92vw); margin: 0 auto; }
    .g2048-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      background: #bbada0; border: 3px solid #000; border-radius: 10px; padding: 10px;
      box-shadow: 4px 4px 0 #000; touch-action: none; user-select: none;
    }
    .g2048-cell {
      background: rgba(238, 228, 218, 0.35); border-radius: 8px;
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', 'Kanit', cursive; font-weight: bold;
      font-size: 18px; color: #776e65;
    }
    .g2048-cell.v2 { background: #eee4da; }
    .g2048-cell.v4 { background: #ede0c8; }
    .g2048-cell.v8 { background: #f2b179; color: #fff; }
    .g2048-cell.v16 { background: #f59563; color: #fff; }
    .g2048-cell.v32 { background: #f67c5f; color: #fff; }
    .g2048-cell.v64 { background: #f65e3b; color: #fff; }
    .g2048-cell.v128, .g2048-cell.v256, .g2048-cell.v512 { background: #edcf72; color: #fff; font-size: 15px; }
    .g2048-cell.v1024, .g2048-cell.v2048 { background: #edc53f; color: #fff; font-size: 12px; }
    .g2048-cell.v2048 { box-shadow: 0 0 18px #ffd93d; }
    .g2048-cell.vbig { background: #3c3a32; color: #fff; font-size: 12px; }

    /* ---------- เกมตีตัวตุ่น ---------- */
    .mole-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(420px, 92vw); margin: 0 auto; }
    .mole-hole {
      aspect-ratio: 1; background: radial-gradient(circle at 50% 45%, #6b4423 0%, #543310 55%, #3e2312 100%);
      border: 3px solid #2c1708; border-radius: 50%; cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
      font-size: 44px; overflow: hidden; position: relative; user-select: none; touch-action: none;
      box-shadow: inset 0 8px 14px rgba(0,0,0,0.55);
    }
    .mole-emoji {
      transform: translateY(110%); transition: transform 0.12s ease;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5));
    }
    .mole-hole.up .mole-emoji { transform: translateY(8%); }
    .mole-hole.bomb.up { background: radial-gradient(circle at 50% 45%, #7f1d1d 0%, #5f1313 55%, #3b0d0d 100%); }
    .mole-hole.whack { animation: molePop 0.18s ease; }
    @keyframes molePop { 0% { transform: scale(1); } 50% { transform: scale(0.94); } 100% { transform: scale(1); } }

    @media (max-width: 600px) {
      .arcade-title { font-size: 16px; }
      .games-grid { grid-template-columns: repeat(2, 1fr); }
      .arcade-shell { padding: 56px 16px 16px; }
      .top-controls { top: 8px; right: 8px; gap: 6px; }
      .control-btn { padding: 6px 10px; font-size: 11px; }
      .user-chip { padding: 6px 10px; font-size: 11px; max-width: 130px; }
      .play-title { font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- ดาวพื้นหลัง -->
<div class="stars" id="stars" aria-hidden="true"></div>

<div class="top-controls">
  <a class="control-btn" href="../index.html" style="text-decoration:none; background:rgba(22, 101, 52, 0.85); border-color:#86efac; color:#fff;">⚡ กลับเว็บ Fitจัง</a>
  <span class="user-chip" id="user-chip" style="display:none;"><span id="user-chip-name"></span></span>
  <button class="control-btn logout-btn" id="logout-btn" style="display:none;" onclick="doLogout()">🚪 ออกจากระบบ</button>
  <a class="control-btn" href="home.html">🏠 หน้าหลัก</a>
  <button class="control-btn" onclick="backToMenu()">🎮 เลือกเกม</button>
</div>

<div class="arcade-shell">

  <!-- ===== เมนูรวมเกม ===== -->
  <div class="menu-wrap" id="menu-wrap">
    <h1 class="arcade-title">🕹️ FUN ARCADE</h1>
    <div class="arcade-subtitle">รวม 10 เกมสนุกๆ เล่นฟรี — เลือกเกมที่ชอบเลย!</div>

    <div class="best-strip" id="best-strip"></div>
    <div class="games-grid" id="games-grid"></div>

    <div class="hub-footer">⭐ สถิติคะแนนสูงสุดบันทึกในเบราว์เซอร์เครื่องนี้ — คอมใช้คีย์บอร์ด มือถือมีปุ่มสัมผัสให้</div>
  </div>

  <!-- ===== หน้าเล่นเกม ===== -->
  <div class="play-wrap" id="play-wrap">
    <h2 class="play-title" id="play-title"></h2>
    <div class="play-howto" id="play-howto"></div>
    <div class="play-hud" id="play-hud"></div>
    <div class="stage-zone" id="stage-zone"></div>
    <div class="play-controls" id="play-controls"></div>
    <div class="touch-pad" id="touch-pad"></div>
    <div class="mobile-note" id="mobile-note"></div>
  </div>

</div>

<script>
  /* ================================================================
     ระบบล็อกอิน — บังคับเข้าสู่ระบบก่อนเข้าเล่น (arcadeSession_v1)
     ================================================================ */
  (function requireLogin() {
    try {
      const raw = localStorage.getItem('arcadeSession_v1');
      const s = raw ? JSON.parse(raw) : null;
      if (!s || !s.phone) { location.replace('login.html'); return; }
      const chip = document.getElementById('user-chip');
      const chipName = document.getElementById('user-chip-name');
      const outBtn = document.getElementById('logout-btn');
      chip.style.display = '';
      chipName.textContent = '👤 ' + s.name;
      outBtn.style.display = '';
    } catch (e) { location.replace('login.html'); }
  })();

  function doLogout() {
    try { sfx('danger'); } catch (e) {}
    if (!confirm('ออกจากระบบหรือไม่? (คะแนนสูงสุดยังอยู่ครบ)')) return;
    localStorage.removeItem('arcadeSession_v1');
    location.replace('login.html');
  }

  /* ================================================================
     ระบบร่วม: เสียง / สถิติ / เมนู
     ================================================================ */
  let audioCtx = null;
  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type) {
    try {
      const ctx = ensureAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'triangle';
      osc.frequency.value = freq;
      const t = ctx.currentTime + start;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function sfx(kind) {
    try {
      if (kind === 'eat') { tone(880, 0, 0.07, 0.15); }
      else if (kind === 'hit') { tone(200, 0, 0.18, 0.22, 'sawtooth'); }
      else if (kind === 'coin') { tone(1318.5, 0, 0.06, 0.12); tone(1760, 0.05, 0.1, 0.1); }
      else if (kind === 'win') { [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i) { tone(f, i * 0.12, 0.3, 0.18); }); }
      else if (kind === 'big') { tone(180, 0, 0.09, 0.16); tone(450, 0.03, 0.06, 0.09); }
      else { tone(740, 0, 0.045, 0.1); }
    } catch (e) {}
  }
  document.addEventListener('pointerdown', function(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const el = e.target.closest('.game-tile, .btn, .tbtn');
    if (!el) return;
    sfx(el.classList.contains('game-tile') ? 'big' : 'tick');
  }, true);

  const BEST_KEY = 'arcadeBestScores_v1';
  function loadBests() {
    try {
      const raw = localStorage.getItem(BEST_KEY);
      const data = raw ? JSON.parse(raw) : {};
      return data && typeof data === 'object' ? data : {};
    } catch (e) { return {}; }
  }
  function saveBest(id, score) {
    try {
      const b = loadBests();
      if (!b[id] || score > b[id]) { b[id] = score; localStorage.setItem(BEST_KEY, JSON.stringify(b)); return true; }
    } catch (e) {}
    return false;
  }

  /* ดาวพื้นหลัง */
  (function buildStars() {
    const box = document.getElementById('stars');
    let html = '';
    for (let i = 0; i < 60; i++) {
      const s = 1 + Math.random() * 2;
      html += '<div class="star" style="left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:' + (Math.random() * 3) + 's;"></div>';
    }
    box.innerHTML = html;
  })();

  /* ================================================================
     ตัวช่วยกลาง: HUD / ปุ่ม / ลูป / ปุ่มสัมผัส
     ================================================================ */
  const playWrap = document.getElementById('play-wrap');
  const menuWrap = document.getElementById('menu-wrap');
  let current = null; // { id, meta, obj } เกมที่กำลังเปิดอยู่

  function setHUD(html) { document.getElementById('play-hud').innerHTML = html; }
  function setNote(txt) { document.getElementById('mobile-note').innerText = txt || ''; }

  function replayControls(label) {
    return '<button class="btn green" id="btn-replay">' + label + '</button>' +
           '<button class="btn gray" onclick="backToMenu()">🎮 กลับเมนู</button>';
  }
  function setControls(html) {
    document.getElementById('play-controls').innerHTML = html;
    const btn = document.getElementById('btn-replay');
    if (btn) btn.onclick = startCurrent;
  }

  /* ลูปเกม (rAF ตัวเดียวต่อเกม กันลูปซ้อน) */
  let rafId = null, looping = false;
  function startLoop(fn) {
    if (looping) return;
    looping = true;
    function tick() {
      if (!looping) return;
      fn();
      if (looping) rafId = requestAnimationFrame(tick);
    }
    tick();
  }
  function stopLoop() {
    looping = false;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  }

  /* ปุ่มสัมผัส: กดค้าง = ส่ง keydown ปล่อย = ส่ง keyup */
  function setupTouchControls(defs) {
    const tp = document.getElementById('touch-pad');
    tp.innerHTML = defs.map(function(k) {
      return '<button class="tbtn' + (k.wide ? ' wide' : '') + '" data-key="' + k.key + '">' + k.label + '</button>';
    }).join('');
    tp.classList.add('show');
    tp.querySelectorAll('.tbtn').forEach(function(b) {
      const key = b.getAttribute('data-key');
      const send = function(type) {
        if (!current || !current.obj) return;
        const h = type === 'down' ? current.obj.keydown : current.obj.keyup;
        if (h) h.call(current.obj, { key: key, preventDefault: function() {} });
      };
      b.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        if (b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (err) {} }
        send('down');
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev) {
        b.addEventListener(ev, function() { send('up'); });
      });
    });
  }
  const TOUCH_DIRS = [
    { key: 'ArrowLeft', label: '◀' }, { key: 'ArrowUp', label: '▲' },
    { key: 'ArrowDown', label: '▼' }, { key: 'ArrowRight', label: '▶' }
  ];

  /* สร้าง canvas */
  function makeCanvas(zone, w, h) {
    const c = document.createElement('canvas');
    c.className = 'game-canvas';
    c.width = w; c.height = h;
    zone.appendChild(c);
    const ctx = c.getContext('2d');
    return { canvas: c, ctx: ctx };
  }
  /* ตั้ง baseline ก่อนวาดทุกครั้งเพื่อกันค่าค้าง */
  function text(ctx, str, x, y, font, color, align) {
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  /* คีย์บอร์ดกลาง: ส่ง event ให้เกมที่เปิดอยู่ */
  document.addEventListener('keydown', function(e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) !== -1) e.preventDefault();
    if (current && current.obj.keydown) current.obj.keydown(e);
  });
  document.addEventListener('keyup', function(e) {
    if (current && current.obj.keyup) current.obj.keyup(e);
  });

  /* ================================================================
     ทะเบียนเกมทั้ง 10
     ================================================================ */
  const GAMES = [
    { id: 'snake',    emoji: '🐍', name: 'SNAKE SAVINGS',   desc: 'เกมงูกินเหรียญ',     howto: 'ลูกศร/WASD หรือปุ่มสัมผัส • เก็บ 💰 ให้งูยาวขึ้น อย่าชนตัวเองและขอบจอ!' },

  /* ================================================================
     เมนู / เปิดเกม
     ================================================================ */
  function renderMenu() {
    const bests = loadBests();
    let html = '';
    for (const g of GAMES) {
      const b = bests[g.id];
      html += '<div class="game-tile" onclick="openGame(\'' + g.id + '\')">' +
                '<span class="tile-emoji">' + g.emoji + '</span>' +
                '<span class="tile-name">' + g.name + '</span>' +
                '<span class="tile-hint">' + g.desc + '</span>' +
                '<span class="tile-best">' + (b ? '⭐ สูงสุด ' + b.toLocaleString() : '') + '</span>' +
              '</div>';
    }
    document.getElementById('games-grid').innerHTML = html;

    const totalBest = GAMES.reduce(function(s, g) { return s + (bests[g.id] || 0); }, 0);
    const played = GAMES.filter(function(g) { return bests[g.id]; }).length;
    document.getElementById('best-strip').innerHTML =
      '<div class="best-chip">🎮 เล่นแล้ว <b>' + played + '/' + GAMES.length + '</b> เกม</div>' +
      '<div class="best-chip">⭐ แต้มรวมทุกสถิติ <b>' + totalBest.toLocaleString() + '</b></div>';
  }

  /* เปิดเกมจากเมนู */
  function openGame(id) {
    const meta = GAMES.find(function(g) { return g.id === id; });
    const obj = GameBuilders[id];
    if (!meta || !obj) return;
    if (current) { try { current.obj.stop(); } catch (e) {} current = null; }
    stopLoop();

    menuWrap.classList.add('hidden');
    playWrap.classList.add('active');
    document.getElementById('play-title').innerText = meta.emoji + ' ' + meta.name;
    document.getElementById('play-howto').innerText = '🕹️ ' + meta.howto;
    document.getElementById('play-hud').innerHTML = '';
    document.getElementById('stage-zone').innerHTML = '';
    setControls(replayControls('▶ เริ่มเกม'));
    const tp = document.getElementById('touch-pad');
    tp.innerHTML = ''; tp.classList.remove('show');
    setNote('');

    window.scrollTo(0, 0);
    current = { id: id, meta: meta, obj: obj };
    obj.setup(document.getElementById('stage-zone'));
  }

  /* เริ่มเกมที่เปิดอยู่ (ปุ่ม ▶/🔄 ก็เรียกตัวนี้) */
  function startCurrent() {
    if (!current) return;
    sfx('big');
    current.obj.start();
  }

  /* กลับเมนูรวมเกม */
  function backToMenu() {
    if (current) { try { current.obj.stop(); } catch (e) {} current = null; }
    stopLoop();
    playWrap.classList.remove('active');
    menuWrap.classList.remove('hidden');
    renderMenu();
    window.scrollTo(0, 0);
  }

  const GameBuilders = {};

  /* ---------------- 1. SNAKE ---------------- */
  GameBuilders.snake = function() {
    const W = 480, H = 480, CELL = 24, COLS = W / CELL, ROWS = H / CELL;
    let cv, ctx, snake, dir, nextDir, coin, score, alive, timer, speed;

    function placeCoin() {
      let p;
      do { p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
      while (snake.some(function(s) { return s.x === p.x && s.y === p.y; }));
      coin = p;
    }
    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke(); }
      for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke(); }
      text(ctx, '💰', coin.x * CELL + CELL / 2, coin.y * CELL + CELL / 2, '18px serif');
      snake.forEach(function(s, i) {
        ctx.fillStyle = i === 0 ? '#99e550' : (i % 2 ? '#6abe30' : '#4d9623');
        ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
        if (i === 0) { ctx.fillStyle = '#000'; ctx.fillRect(s.x * CELL + 7, s.y * CELL + 8, 3, 3); ctx.fillRect(s.x * CELL + 14, s.y * CELL + 8, 3, 3); }
      });
      if (!alive) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, H / 2 - 40, W, 80);
        text(ctx, 'GAME OVER', W / 2, H / 2 - 8, 'bold 22px Kanit', '#d95763');
        text(ctx, 'คะแนน: ' + score, W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      }
    }
    function step() {
      if (!alive) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const hitSelf = snake.some(function(s) { return s.x === head.x && s.y === head.y; });
      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || hitSelf) {
        alive = false; sfx('hit');
        clearInterval(timer); timer = null;
        const isBest = saveBest('snake', score);
        setHUD('<div class="hud-chip">⭐ สถิติ <span>' + (loadBests().snake || 0) + '</span></div>');
        setControls(replayControls('🔄 เล่นใหม่'));
        setNote('จบเกม! คะแนน ' + score + (isBest ? ' 🏆 สถิติใหม่!' : ''));
        draw();
        return;
      }
      snake.unshift(head);
      if (head.x === coin.x && head.y === coin.y) {
        score += 10; sfx('coin');
        if (score % 50 === 0 && speed > 70) { speed -= 10; clearInterval(timer); timer = setInterval(step, speed); }
        placeCoin();
      } else {
        snake.pop();
      }
      setHUD('<div class="hud-chip">💰 คะแนน <span>' + score + '</span></div><div class="hud-chip">📏 ความยาว <span>' + snake.length + '</span></div>');
      draw();
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
        dir = { x: 1, y: 0 }; nextDir = dir; alive = false; score = 0; speed = 140;
        placeCoin(); draw();
        setHUD('<div class="hud-chip">กด ▶ เริ่มเกม แล้วใช้ลูกศรเลื่อนงู</div>');
        setupTouchControls(TOUCH_DIRS);
        setNote('บนมือถือใช้ปุ่มลูกศรด้านล่างเลื่อนงูได้เลย');
      },
      start: function() {
        if (timer) clearInterval(timer);
        snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
        dir = { x: 1, y: 0 }; nextDir = dir; alive = true; score = 0; speed = 140;
        placeCoin();
        timer = setInterval(step, speed);
        setHUD('<div class="hud-chip">💰 คะแนน <span>0</span></div>');
        setControls(replayControls('🔄 เริ่มใหม่'));
      },
      stop: function() { if (timer) { clearInterval(timer); timer = null; } },
      keydown: function(e) {
        const k = e.key;
        if ((k === 'ArrowUp' || k === 'w') && dir.y === 0) nextDir = { x: 0, y: -1 };
        else if ((k === 'ArrowDown' || k === 's') && dir.y === 0) nextDir = { x: 0, y: 1 };
        else if ((k === 'ArrowLeft' || k === 'a') && dir.x === 0) nextDir = { x: -1, y: 0 };
        else if ((k === 'ArrowRight' || k === 'd') && dir.x === 0) nextDir = { x: 1, y: 0 };
        else if (k === ' ' && !alive) startCurrent();
      }
    };
  }();

  /* ---------------- 2. FLAPPY ---------------- */
  GameBuilders.flappy = function() {
    const W = 420, H = 520, PIPE_W = 60, GAP = 150;
    let cv, ctx, bird, pipes, coins, score, coinsGot, phase; // idle | play | over

    function newPipe(x) {
      const top = 60 + Math.random() * (H - GAP - 160);
      const p = { x: x, top: top, passed: false };
      if (Math.random() < 0.6) coins.push({ x: x + PIPE_W / 2, y: top + GAP / 2, got: false });
      return p;
    }
    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, (i * 53) % H, 2, 2);
      for (const p of pipes) {
        ctx.fillStyle = '#5b6ee1'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.fillRect(p.x, 0, PIPE_W, p.top); ctx.strokeRect(p.x, 0, PIPE_W, p.top);
        ctx.fillRect(p.x, p.top + GAP, PIPE_W, H - p.top - GAP); ctx.strokeRect(p.x, p.top + GAP, PIPE_W, H - p.top - GAP);
      }
      for (const c of coins) if (!c.got) text(ctx, '💰', c.x, c.y, '20px serif');
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.max(-0.5, Math.min(1, bird.vy / 10)));
      text(ctx, '🐤', 0, 0, '28px serif', '#fff', 'center');
      ctx.restore();
      if (phase === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, H / 2 - 44, W, 88);
        text(ctx, 'GAME OVER', W / 2, H / 2 - 10, 'bold 22px Kanit', '#d95763');
        const total = score + coinsGot;
        text(ctx, 'ผ่าน ' + score + ' ท่อ • เก็บ ' + coinsGot + ' เหรียญ = ' + total + ' แต้ม', W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      } else if (phase === 'idle') {
        text(ctx, 'กด Space / แตะเพื่อบิน!', W / 2, H / 2 - 60, 'bold 16px Kanit', '#ffd97a');
      }
    }
    function update() {
      if (phase === 'play') {
        bird.vy += 0.45; bird.y += bird.vy;
        for (const p of pipes) {
          p.x -= 2.6;
          if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; sfx('tick'); }
          if (bird.x + 12 > p.x && bird.x - 12 < p.x + PIPE_W && (bird.y - 12 < p.top || bird.y + 12 > p.top + GAP)) { die(); return; }
        }
        if (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();
        const last = pipes[pipes.length - 1];
        if (!last || last.x < W - 210) pipes.push(newPipe(W + 20));
        for (const c of coins) {
          c.x -= 2.6;
          if (!c.got && Math.abs(c.x - bird.x) < 18 && Math.abs(c.y - bird.y) < 18) { c.got = true; coinsGot++; sfx('coin'); }
        }
        coins = coins.filter(function(c) { return c.x > -20 && !c.got; });
        setHUD('<div class="hud-chip">🚇 ท่อ <span>' + score + '</span> • 💰 เหรียญ <span>' + coinsGot + '</span></div>');
        if (bird.y > H - 14 || bird.y < -20) { die(); return; }
      } else if (phase === 'idle') {
        bird.y = H / 2 + Math.sin(Date.now() / 300) * 14;
        bird.vy = 0;
      }
      draw();
    }
    function die() {
      phase = 'over'; sfx('hit');
      const total = score + coinsGot;
      const isBest = saveBest('flappy', total);
      setHUD('<div class="hud-chip">🎯 แต้มรวม <span>' + total + '</span></div><div class="hud-chip">⭐ สถิติ <span>' + (loadBests().flappy || 0) + '</span></div>');
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('จบเกม! แต้มรวม ' + total + (isBest ? ' 🏆 สถิติใหม่!' : ''));
      draw();
      stopLoop();
    }
    function flap() {
      if (phase === 'over') return;
      if (phase === 'idle') phase = 'play';
      bird.vy = -7.2; sfx('tick');
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        cv.style.cursor = 'pointer';
        cv.addEventListener('pointerdown', function(e) { e.preventDefault(); flap(); });
        bird = { x: 110, y: H / 2, vy: 0 };
        pipes = []; coins = []; score = 0; coinsGot = 0; phase = 'idle';
        pipes.push(newPipe(W + 40));
        setHUD('<div class="hud-chip">🚇 ท่อ <span>0</span> • 💰 เหรียญ <span>0</span></div>');
        setupTouchControls([{ key: ' ', label: '🪽 บิน', wide: true }]);
        setNote('แตะที่หน้าจอเกมหรือปุ่ม 🪽 เพื่อกระพือปีก');
        startLoop(update);
      },
      start: function() {
        bird = { x: 110, y: H / 2, vy: 0 };
        pipes = []; coins = []; score = 0; coinsGot = 0; phase = 'idle';
        pipes.push(newPipe(W + 40));
        setHUD('<div class="hud-chip">🚇 ท่อ <span>0</span> • 💰 เหรียญ <span>0</span></div>');
        setControls(replayControls('🔄 เริ่มใหม่'));
        startLoop(update);
      },
      stop: function() { stopLoop(); },
      keydown: function(e) { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') flap(); }
    };
  }();

  /* ---------------- 3. BREAKOUT ---------------- */
  GameBuilders.breakout = function() {
    const W = 480, H = 460, ROWS = 5, COLS = 8, BW = 52, BH = 18, TOP = 60;
    let cv, ctx, paddle, ball, bricks, score, lives, launched, won, phase; // play | over | win

    function buildBricks() {
      bricks = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          bricks.push({
            x: 18 + c * (BW + 5), y: TOP + r * (BH + 6),
            hp: r < 2 ? 2 : 1, coin: Math.random() < 0.25,
            color: ['#d95763', '#df7126', '#fbf236', '#6abe30', '#5b6ee1'][r]
          });
        }
      }
    }
    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        ctx.fillStyle = b.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.fillRect(b.x, b.y, BW, BH); ctx.strokeRect(b.x, b.y, BW, BH);
        if (b.hp > 1) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(b.x + 3, b.y + 3, BW - 6, 4); }
        if (b.coin) text(ctx, '💰', b.x + BW / 2, b.y + BH / 2, '11px serif');
      }
      ctx.fillStyle = '#cbdbfc'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, 12); ctx.strokeRect(paddle.x, paddle.y, paddle.w, 12);
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#fbf236'; ctx.fill(); ctx.stroke();
      if (phase === 'play' && !launched) {
        text(ctx, 'กด Space หรือแตะเพื่อยิงลูกบอล!', W / 2, H - 60, 'bold 14px Kanit', '#ffd97a');
      }
      if (phase === 'win') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, H / 2 - 40, W, 80);
        text(ctx, '🏆 ทลายอิฐครบทุกก้อน!', W / 2, H / 2 - 8, 'bold 22px Kanit', '#99e550');
        text(ctx, 'คะแนน: ' + score, W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      }
      if (phase === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, H / 2 - 40, W, 80);
        text(ctx, 'GAME OVER', W / 2, H / 2 - 8, 'bold 22px Kanit', '#d95763');
        text(ctx, 'คะแนน: ' + score, W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      }
    }
    function update() {
      if (phase !== 'play') return;
      if (launched) {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < 8 || ball.x > W - 8) { ball.vx *= -1; sfx('tick'); }
        if (ball.y < 8) { ball.vy *= -1; sfx('tick'); }
        if (ball.y + 7 > paddle.y && ball.y + 7 < paddle.y + 16 && ball.x > paddle.x - 6 && ball.x < paddle.x + paddle.w + 6 && ball.vy > 0) {
          const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          ball.vx = hit * sp * 0.85; ball.vy = -Math.abs(ball.vy); sfx('tick');
        }
        for (const b of bricks) {
          if (b.hp <= 0) continue;
          if (ball.x > b.x - 6 && ball.x < b.x + BW + 6 && ball.y > b.y - 6 && ball.y < b.y + BH + 6) {
            b.hp--; sfx('hit');
            ball.vy *= -1;
            score += b.coin ? 20 : 10;
            if (b.hp <= 0 && b.coin) score += 15;
            setHUD('<div class="hud-chip">⭐ คะแนน <span>' + score + '</span></div><div class="hud-chip">❤️ ชีวิต <span>' + lives + '</span></div>');
            break;
          }
        }
        if (bricks.every(function(b) { return b.hp <= 0; })) { winGame(); return; }
        if (ball.y > H + 10) {
          lives--;
          if (lives <= 0) {
            phase = 'over'; sfx('hit');
            const isBest = saveBest('breakout', score);
            setHUD('<div class="hud-chip">⭐ สถิติ <span>' + (loadBests().breakout || 0) + '</span></div>');
            setControls(replayControls('🔄 เล่นใหม่'));
            setNote('จบเกม! คะแนน ' + score + (isBest ? ' 🏆 สถิติใหม่!' : ''));
            draw(); stopLoop();
            return;
          }
          launched = false; ball.vx = 0; ball.vy = 0;
        }
      } else {
        ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - 10;
      }
      draw();
    }
    function winGame() {
      phase = 'win'; sfx('win');
      saveBest('breakout', score);
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('สุดยอด! ทลายอิฐครบทุกก้อน ได้ ' + score + ' แต้ม');
      draw(); stopLoop();
    }
    function movePaddle(clientX) {
      const rect = cv.getBoundingClientRect();
      const x = (clientX - rect.left) * (W / rect.width);
      paddle.x = Math.max(4, Math.min(W - paddle.w - 4, x - paddle.w / 2));
    }
    function launch() { if (!launched && phase === 'play') { launched = true; ball.vx = 3; ball.vy = -4.4; sfx('big'); } }
    function reset() {
      paddle = { x: W / 2 - 45, y: H - 30, w: 90 };
      ball = { x: W / 2, y: paddle.y - 10, vx: 0, vy: 0 };
      score = 0; lives = 3; launched = false; won = false; phase = 'play';
      buildBricks();
      setHUD('<div class="hud-chip">⭐ คะแนน <span>0</span></div><div class="hud-chip">❤️ ชีวิต <span>3</span></div>');
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        reset(); phase = 'ready'; ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - 10;
        buildBricks();
        cv.addEventListener('pointermove', function(e) { movePaddle(e.clientX); });
        cv.addEventListener('pointerdown', function(e) { movePaddle(e.clientX); launch(); });
        setHUD('<div class="hud-chip">เลื่อนแป้นแล้วกด ▶ เริ่มเกม</div>');
        setNote('เลื่อนเมาส์หรือนิ้วบนหน้าจอเกมเพื่อขยับแป้น');
        draw();
      },
      start: function() {
        reset();
        setControls(replayControls('🔄 เริ่มใหม่'));
        startLoop(update);
      },
      stop: function() { stopLoop(); },
      keydown: function(e) {
        const S = 34;
        if (e.key === 'ArrowLeft' || e.key === 'a') paddle.x = Math.max(4, paddle.x - S);
        else if (e.key === 'ArrowRight' || e.key === 'd') paddle.x = Math.min(W - paddle.w - 4, paddle.x + S);
        else if (e.key === ' ') launch();
      }
    };
  }();

  /* ---------------- 4. SHOOTER ---------------- */
  GameBuilders.shooter = function() {
    const W = 480, H = 520;
    let cv, ctx, ship, bullets, enemies, ebullets, score, wave, dead, keys, cool;

    function spawnWave(n) {
      enemies = [];
      const cols = Math.min(7, 4 + Math.floor(n / 2));
      const rows = Math.min(4, 2 + Math.floor(n / 3));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: W / 2 + (c - (cols - 1) / 2) * 52, y: 50 + r * 46,
            vx: (c % 2 ? 1 : 1) * (1.1 + n * 0.15),
            emoji: ['👾', '🛸', '👽'][(r + c) % 3]
          });
        }
      }
    }
    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (let i = 0; i < 40; i++) ctx.fillRect((i * 89) % W, (i * 47) % H, 2, 2);
      for (const e of enemies) text(ctx, e.emoji, e.x, e.y, '26px serif');
      for (const b of bullets) text(ctx, '🪙', b.x, b.y, '20px serif');
      ctx.fillStyle = '#d95763';
      for (const b of ebullets) ctx.fillRect(b.x - 2, b.y, 4, 10);
      if (!dead) text(ctx, '🚀', ship.x, ship.y, '30px serif');
      if (dead) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, H / 2 - 44, W, 88);
        text(ctx, 'GAME OVER', W / 2, H / 2 - 10, 'bold 22px Kanit', '#d95763');
        text(ctx, 'คะแนน: ' + score + ' • ถึงระลอก ' + wave, W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      }
    }
    function update() {
      if (dead) return;
      if (keys.ArrowLeft || keys.a) ship.x -= 5;
      if (keys.ArrowRight || keys.d) ship.x += 5;
      ship.x = Math.max(24, Math.min(W - 24, ship.x));
      cool--;
      if ((keys[' '] || keys.fire) && cool <= 0) { bullets.push({ x: ship.x, y: ship.y - 20 }); cool = 16; sfx('tick'); }
      for (const b of bullets) b.y -= 7;
      bullets = bullets.filter(function(b) { return b.y > -20; });

      let flip = false;
      for (const e of enemies) {
        e.x += e.vx;
        if (e.x < 24 || e.x > W - 24) flip = true;
        if (Math.random() < 0.0006 + wave * 0.0003) ebullets.push({ x: e.x, y: e.y + 14 });
      }
      if (flip) { for (const e of enemies) { e.vx *= -1; e.y += 10; } }
      for (const b of ebullets) b.y += 3.4;
      ebullets = ebullets.filter(function(b) { return b.y < H + 10; });

      for (const b of bullets) {
        for (const e of enemies) {
          if (Math.abs(b.x - e.x) < 22 && Math.abs(b.y - e.y) < 18) { e.dead = true; b.dead = true; score += 15; sfx('coin'); break; }
        }
      }
      bullets = bullets.filter(function(b) { return !b.dead; });
      enemies = enemies.filter(function(e) { return !e.dead; });

      for (const e of enemies) {
        if (Math.abs(e.x - ship.x) < 26 && Math.abs(e.y - ship.y) < 26) { die(); return; }
        if (e.y > H - 60) { die(); return; }
      }
      for (const b of ebullets) {
        if (Math.abs(b.x - ship.x) < 16 && Math.abs(b.y - ship.y) < 18) { die(); return; }
      }
      if (enemies.length === 0) { wave++; sfx('win'); spawnWave(wave); }
      setHUD('<div class="hud-chip">⭐ คะแนน <span>' + score + '</span></div><div class="hud-chip">🌊 ระลอก <span>' + wave + '</span></div><div class="hud-chip">👾 เหลือ <span>' + enemies.length + '</span></div>');
      draw();
    }
    function die() {
      dead = true; sfx('hit');
      const isBest = saveBest('shooter', score);
      setHUD('<div class="hud-chip">⭐ สถิติ <span>' + (loadBests().shooter || 0) + '</span></div>');
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('จบเกม! คะแนน ' + score + ' ถึงระลอก ' + wave + (isBest ? ' 🏆 สถิติใหม่!' : ''));
      draw(); stopLoop();
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        cv.addEventListener('pointermove', function(e) {
          const rect = cv.getBoundingClientRect();
          ship.x = Math.max(24, Math.min(W - 24, (e.clientX - rect.left) * (W / rect.width)));
        });
        ship = { x: W / 2, y: H - 40 }; bullets = []; ebullets = [];
        score = 0; wave = 1; dead = true; keys = {}; cool = 0;
        spawnWave(1); draw();
        setHUD('<div class="hud-chip">กด ▶ เริ่มเกม แล้วยิงเอเลี่ยนให้หมด!</div>');
        setupTouchControls([{ key: 'ArrowLeft', label: '◀' }, { key: 'fire', label: '🔥 ยิง', wide: true }, { key: 'ArrowRight', label: '▶' }]);
        setNote('ลากนิ้วบนหน้าจอเกมเพื่อเลื่อนยาน กดค้าง 🔥 เพื่อยิงเหรียญต่อเนื่อง');
      },
      start: function() {
        ship = { x: W / 2, y: H - 40 }; bullets = []; ebullets = [];
        score = 0; wave = 1; dead = false; keys = {}; cool = 0;
        spawnWave(1);
        setControls(replayControls('🔄 เริ่มใหม่'));
        startLoop(update);
      },
      stop: function() { stopLoop(); },
      keydown: function(e) {
        if (e.key === ' ' || e.key === 'fire') keys[' '] = true;
        else keys[e.key] = true;
      },
      keyup: function(e) {
        if (e.key === ' ' || e.key === 'fire') keys[' '] = false;
        else keys[e.key] = false;
      }
    };
  }();

  /* ---------------- 5. PONG ---------------- */
  GameBuilders.pong = function() {
    const W = 560, H = 400, PW = 10, PH = 70;
    let cv, ctx, player, cpu, ball, scoreP, scoreC, rally, phase; // play | over

    function resetBall(towardPlayer) {
      ball = { x: W / 2, y: H / 2, vx: towardPlayer ? -4.2 : 4.2, vy: (Math.random() - 0.5) * 6 };
    }
    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      ctx.setLineDash([8, 10]); ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
      text(ctx, String(scoreP), W / 2 - 60, 56, 'bold 34px "Press Start 2P", Kanit', 'rgba(255,255,255,0.2)');
      text(ctx, String(scoreC), W / 2 + 60, 56, 'bold 34px "Press Start 2P", Kanit', 'rgba(255,255,255,0.2)');
      ctx.fillStyle = '#99e550'; ctx.fillRect(14, player.y - PH / 2, PW, PH);
      ctx.fillStyle = '#d95763'; ctx.fillRect(W - 14 - PW, cpu.y - PH / 2, PW, PH);
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2); ctx.fillStyle = '#fbf236'; ctx.fill();
    }
    function update() {
      if (phase !== 'play') return;
      const target = ball.vx > 0 ? ball.y : H / 2;
      cpu.y += Math.sign(target - cpu.y) * Math.min(3.6, Math.abs(target - cpu.y));
      cpu.y = Math.max(PH / 2, Math.min(H - PH / 2, cpu.y));
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.y < 8 || ball.y > H - 8) { ball.vy *= -1; sfx('tick'); }
      if (ball.vx < 0 && ball.x < 34 && ball.x > 14 && Math.abs(ball.y - player.y) < PH / 2 + 8) {
        ball.vx = Math.abs(ball.vx) + 0.25;
        ball.vy += (ball.y - player.y) * 0.09;
        rally++; sfx('tick');
      }
      if (ball.vx > 0 && ball.x > W - 34 && ball.x < W - 14 && Math.abs(ball.y - cpu.y) < PH / 2 + 8) {
        ball.vx = -(Math.abs(ball.vx) + 0.25);
        ball.vy += (ball.y - cpu.y) * 0.09;
        sfx('tick');
      }
      if (ball.x < -10) { scoreC++; sfx('hit'); point(); }
      else if (ball.x > W + 10) { scoreP++; sfx('coin'); point(); }
      if (phase === 'play') {
        setHUD('<div class="hud-chip">🟢 คุณ <span>' + scoreP + '</span></div><div class="hud-chip">🔴 CPU <span>' + scoreC + '</span></div><div class="hud-chip">🔁 ชนติด <span>' + rally + '</span></div>');
        draw();
      }
    }
    function point() {
      rally = 0;
      if (scoreP >= 5 || scoreC >= 5) {
        phase = 'over';
        const win = scoreP >= 5;
        if (win) { saveBest('pong', 100); sfx('win'); } else { sfx('hit'); }
        setControls(replayControls('🔄 แข่งใหม่'));
        setNote(win ? '🏆 ชนะ ' + scoreP + '-' + scoreC + ' เก่งมาก!' : '😢 แพ้ CPU ' + scoreP + '-' + scoreC + ' ลองใหม่นะ');
        draw(); stopLoop();
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, H / 2 - 44, W, 88);
        text(ctx, win ? '🏆 ชนะ! เก่งมาก' : '😢 แพ้ CPU', W / 2, H / 2 - 8, 'bold 24px Kanit', win ? '#99e550' : '#d95763');
        text(ctx, scoreP + ' - ' + scoreC, W / 2, H / 2 + 20, 'bold 15px Kanit', '#fff');
        return;
      }
      resetBall(ball.x < 0); // ลูกออกฝั่งไหน เสิร์ฟกลับเข้าหาฝั่งนั้น
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        player = { y: H / 2 }; cpu = { y: H / 2 }; scoreP = 0; scoreC = 0; rally = 0;
        resetBall(true); draw();
        cv.addEventListener('pointermove', function(e) {
          const rect = cv.getBoundingClientRect();
          player.y = Math.max(PH / 2, Math.min(H - PH / 2, (e.clientY - rect.top) * (H / rect.height)));
        });
        setupTouchControls([{ key: 'ArrowUp', label: '▲' }, { key: 'ArrowDown', label: '▼' }]);
        setNote('เลื่อนเมาส์/นิ้วบนหน้าจอเกม หรือกดค้างปุ่ม ▲▼ เพื่อเลื่อนไม้');
      },
      start: function() {
        player = { y: H / 2 }; cpu = { y: H / 2 }; scoreP = 0; scoreC = 0; rally = 0; phase = 'play';
        resetBall(true);
        setControls(replayControls('🔄 แข่งใหม่'));
        startLoop(update);
      },
      stop: function() { stopLoop(); },
      keydown: function(e) {
        if (e.key === 'ArrowUp' || e.key === 'w') player.y = Math.max(PH / 2, player.y - 30);
        if (e.key === 'ArrowDown' || e.key === 's') player.y = Math.min(H - PH / 2, player.y + 30);
      }
    };
  }();

  /* ---------------- 6. DINO RUN ---------------- */
  GameBuilders.dino = function() {
    const W = 560, H = 300, GROUND = 250, DX = 60;
    let cv, ctx, dino, obs, speed, dist, dead, spawnCd, phase; // ready | play | over

    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#3f3f74'; ctx.fillRect(0, GROUND, W, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      for (let i = 0; i < 8; i++) {
        const gx = ((i * 73) - Math.floor(dist * 0.5) % 560 + 560) % 560;
        ctx.fillRect(gx, GROUND + 14 + (i % 3) * 8, 14, 3);
      }
      text(ctx, '🌞', W - 50, 44, '22px serif');
      text(ctx, dino.duck && dino.onGround ? '🦎' : '🦖', DX, dino.y - (dino.duck && dino.onGround ? 8 : 16), '34px serif');
      for (const o of obs) text(ctx, o.emoji, o.x, o.fly ? o.y : GROUND + 2, (o.big ? '30px' : '24px') + ' serif');
      if (phase === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, H / 2 - 40, W, 80);
        text(ctx, 'GAME OVER', W / 2, H / 2 - 8, 'bold 22px Kanit', '#d95763');
        text(ctx, 'วิ่งได้ ' + Math.floor(dist / 10) + ' แต้ม', W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      } else if (phase === 'ready') {
        text(ctx, 'พร้อมแล้ว? กด ▶ เริ่มเกม', W / 2, H / 2 - 20, 'bold 16px Kanit', '#ffd97a');
      }
    }
    function update() {
      if (phase !== 'play') return;
      speed += 0.0035; dist += speed;
      dino.vy += 0.65;
      dino.y += dino.vy;
      if (dino.y >= GROUND) { dino.y = GROUND; dino.vy = 0; dino.onGround = true; } else dino.onGround = false;

      spawnCd -= speed;
      if (spawnCd <= 0) {
        if (Math.random() < 0.25 && dist > 400) {
          obs.push({ x: W + 30, emoji: '🐦', fly: true, y: Math.random() < 0.5 ? GROUND - 46 : GROUND - 8 });
        } else {
          obs.push({ x: W + 30, emoji: '🌵', big: Math.random() < 0.4 });
        }
        spawnCd = 130 + Math.random() * 120;
      }
      for (const o of obs) o.x -= speed;
      obs = obs.filter(function(o) { return o.x > -40; });

      const ducking = dino.duck && dino.onGround;
      const dTop = dino.y - (ducking ? 22 : 38);
      const dBot = dino.y;
      for (const o of obs) {
        const halfW = o.fly ? 14 : (o.big ? 12 : 10);
        let oTop, oBot;
        if (o.fly) { oTop = o.y - 12; oBot = o.y + 12; }
        else { oBot = GROUND; oTop = GROUND - (o.big ? 30 : 22); }
        if (Math.abs(DX - o.x) < 12 + halfW && dTop < oBot && dBot > oTop) { die(); return; }
      }
      setHUD('<div class="hud-chip">🏃 ระยะทาง <span>' + Math.floor(dist / 10) + ' แต้ม</span></div><div class="hud-chip">⚡ ความเร็ว <span>' + speed.toFixed(1) + '</span></div>');
      draw();
    }
    function die() {
      phase = 'over'; dead = true; sfx('hit');
      const sc = Math.floor(dist / 10);
      const isBest = saveBest('dino', sc);
      setHUD('<div class="hud-chip">⭐ สถิติ <span>' + (loadBests().dino || 0) + '</span></div>');
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('จบเกม! วิ่งได้ ' + sc + ' แต้ม' + (isBest ? ' 🏆 สถิติใหม่!' : ''));
      draw(); stopLoop();
    }
    function jump() {
      if (phase !== 'play') return;
      if (dino.onGround) { dino.vy = -11.5; sfx('tick'); }
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        dino = { y: GROUND, vy: 0, onGround: true, duck: false };
        obs = []; speed = 4; dist = 0; dead = true; spawnCd = 100; phase = 'ready';
        setHUD('<div class="hud-chip">กด ▶ เริ่มเกม แล้วกระโดดหลบกระบอก!</div>');
        setupTouchControls([{ key: ' ', label: '🦘 กระโดด', wide: true }, { key: 'ArrowDown', label: '⬇️ ดิ้งลง' }]);
        setNote('แตะปุ่ม 🦘 เพื่อกระโดด กดค้าง ⬇️ เพื่อดิ้งลงหลบนก');
        draw();
      },
      start: function() {
        dino = { y: GROUND, vy: 0, onGround: true, duck: false };
        obs = []; speed = 4; dist = 0; dead = false; spawnCd = 100; phase = 'play';
        setControls(replayControls('🔄 เริ่มใหม่'));
        startLoop(update);
      },
      stop: function() { stopLoop(); },
      keydown: function(e) {
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jump();
        if (e.key === 'ArrowDown' || e.key === 's') dino.duck = true;
      },
      keyup: function(e) {
        if (e.key === 'ArrowDown' || e.key === 's') dino.duck = false;
      }
    };
  }();

  /* ---------------- 7. TETRIS ---------------- */
  GameBuilders.tetris = function() {
    const COLS = 10, ROWS = 20, CELL = 24, W = COLS * CELL, H = ROWS * CELL;
    const SHAPES = {
      I: [[1, 1, 1, 1]], O: [[1, 1], [1, 1]], T: [[1, 1, 1], [0, 1, 0]],
      S: [[0, 1, 1], [1, 1, 0]], Z: [[1, 1, 0], [0, 1, 1]], J: [[1, 0, 0], [1, 1, 1]], L: [[0, 0, 1], [1, 1, 1]]
    };
    const COLORS = { I: '#5b6ee1', O: '#fbf236', T: '#c56cf0', S: '#6abe30', Z: '#d95763', J: '#5d9cec', L: '#df7126' };
    const KEYS = Object.keys(SHAPES);
    let cv, ctx, grid, cur, score, lines, dead, dropCd, phase; // ready | play | over

    function newPiece() {
      const k = KEYS[Math.floor(Math.random() * KEYS.length)];
      const m = SHAPES[k].map(function(r) { return r.slice(); });
      return { m: m, k: k, x: Math.floor((COLS - m[0].length) / 2), y: 0 };
    }
    function collide(p, dx, dy, mat) {
      const m = mat || p.m;
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (!m[r][c]) continue;
          const x = p.x + c + dx, y = p.y + r + dy;
          if (x < 0 || x >= COLS || y >= ROWS) return true;
          if (y >= 0 && grid[y][x]) return true;
        }
      }
      return false;
    }
    function merge() {
      cur.m.forEach(function(row, r) {
        row.forEach(function(v, c) { if (v && cur.y + r >= 0) grid[cur.y + r][cur.x + c] = cur.k; });
      });
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(Boolean)) { grid.splice(r, 1); grid.unshift(Array(COLS).fill(0)); cleared++; r++; }
      }
      if (cleared) { score += [0, 100, 300, 500, 800][cleared]; lines += cleared; sfx('coin'); }
      else sfx('tick');
      cur = newPiece();
      if (collide(cur, 0, 0)) die();
    }
    function rotate(m) {
      const N = m.length, M = m[0].length, out = [];
      for (let c = 0; c < M; c++) { out.push([]); for (let r = N - 1; r >= 0; r--) out[c].push(m[r][c]); }
      return out;
    }
    function draw() {
      ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke(); }
      for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke(); }
      function block(x, y, color) {
        ctx.fillStyle = color; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        ctx.strokeRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x * CELL + 3, y * CELL + 3, CELL - 6, 4);
      }
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c]) block(c, r, COLORS[grid[r][c]]);
      if (cur && phase !== 'over') cur.m.forEach(function(row, r) {
        row.forEach(function(v, c) { if (v && cur.y + r >= 0) block(cur.x + c, cur.y + r, COLORS[cur.k]); });
      });
      if (phase === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, H / 2 - 44, W, 88);
        text(ctx, 'GAME OVER', W / 2, H / 2 - 10, 'bold 22px Kanit', '#d95763');
        text(ctx, 'แต้ม ' + score + ' • กวาด ' + lines + ' แถว', W / 2, H / 2 + 18, 'bold 15px Kanit', '#fff');
      }
    }
    function update() {
      if (phase !== 'play') return;
      dropCd--;
      const interval = Math.max(6, 34 - Math.floor(lines / 3) * 2);
      if (dropCd <= 0) {
        if (!collide(cur, 0, 1)) cur.y++;
        else merge();
        dropCd = interval;
        updateHUD();
      }
      draw();
    }
    function die() {
      phase = 'over'; dead = true; sfx('hit');
      const isBest = saveBest('tetris', score);
      setHUD('<div class="hud-chip">⭐ สถิติ <span>' + (loadBests().tetris || 0) + '</span></div>');
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('จบเกม! แต้ม ' + score + ' กวาดได้ ' + lines + ' แถว' + (isBest ? ' 🏆 สถิติใหม่!' : ''));
      draw(); stopLoop();
    }
    function updateHUD() {
      setHUD('<div class="hud-chip">⭐ แต้ม <span>' + score + '</span></div><div class="hud-chip">🧹 แถว <span>' + lines + '</span></div>');
    }
    return {
      setup: function(zone) {
        const made = makeCanvas(zone, W, H); cv = made.canvas; ctx = made.ctx;
        grid = Array.from({ length: ROWS }, function() { return Array(COLS).fill(0); });
        cur = newPiece(); score = 0; lines = 0; dead = true; dropCd = 30; phase = 'ready';
        setHUD('<div class="hud-chip">กด ▶ เริ่มเกม แล้วเรียงบล็อกให้เต็มแถว!</div>');
        setupTouchControls([{ key: 'ArrowLeft', label: '◀' }, { key: 'ArrowUp', label: '🔄 หมุน' }, { key: 'ArrowRight', label: '▶' }, { key: 'ArrowDown', label: '⬇ เร่ง' }, { key: ' ', label: '⏬ ดรอป', wide: true }]);
        draw();
      },
      start: function() {
        grid = Array.from({ length: ROWS }, function() { return Array(COLS).fill(0); });
        cur = newPiece(); score = 0; lines = 0; dead = false; dropCd = 30; phase = 'play';
        updateHUD();
        setControls(replayControls('🔄 เริ่มใหม่'));
        startLoop(update);
      },
      stop: function() { stopLoop(); },
      keydown: function(e) {
        if (phase !== 'play') { if (e.key === ' ') startCurrent(); return; }
        if (e.key === 'ArrowLeft' || e.key === 'a') { if (!collide(cur, -1, 0)) cur.x--; }
        else if (e.key === 'ArrowRight' || e.key === 'd') { if (!collide(cur, 1, 0)) cur.x++; }
        else if (e.key === 'ArrowDown' || e.key === 's') { if (!collide(cur, 0, 1)) { cur.y++; score += 1; } }
        else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'r') {
          const rot = rotate(cur.m);
          if (!collide(cur, 0, 0, rot)) cur.m = rot;
          else if (!collide(cur, 1, 0, rot)) { cur.m = rot; cur.x++; }
          else if (!collide(cur, -1, 0, rot)) { cur.m = rot; cur.x--; }
        } else if (e.key === ' ') {
          while (!collide(cur, 0, 1)) { cur.y++; score += 2; }
          merge();
        }
        updateHUD();
        draw();
      }
    };
  }();

  /* ---------------- 8. MEMORY (DOM) ---------------- */
  GameBuilders.memory = function() {
    const EMOJIS = ['💰', '🐷', '🚀', '🌟', '🍀', '🎯', '💎', '🌈'];
    let first, second, lock, moves, matched;
    function build(zone) {
      zone.innerHTML = '<div class="mem-grid" id="mem-grid"></div>';
      const gridEl = document.getElementById('mem-grid');
      const deck = EMOJIS.concat(EMOJIS).sort(function() { return Math.random() - 0.5; });
      gridEl.innerHTML = deck.map(function(e) {
        return '<div class="mem-card" data-e="' + e + '">' +
                 '<div class="mem-inner">' +
                   '<div class="mem-face mem-back">🪙</div>' +
                   '<div class="mem-face mem-front">' + e + '</div>' +
                 '</div>' +
               '</div>';
      }).join('');
      gridEl.querySelectorAll('.mem-card').forEach(function(card) {
        card.addEventListener('click', function() { flip(card); });
      });
    }
    function flip(card) {
      if (lock || card.classList.contains('matched') || card.classList.contains('flipped')) return;
      card.classList.add('flipped'); sfx('tick');
      if (!first) { first = card; return; }
      second = card; lock = true; moves++;
      updateHUD();
      if (first.getAttribute('data-e') === second.getAttribute('data-e')) {
        setTimeout(function() {
          first.classList.add('matched'); second.classList.add('matched');
          first.classList.remove('flipped'); second.classList.remove('flipped');
          first = null; second = null; lock = false;
          matched++; sfx('coin');
          if (matched === EMOJIS.length) win();
        }, 350);
      } else {
        setTimeout(function() {
          first.classList.add('shake'); second.classList.add('shake');
          setTimeout(function() {
            first.classList.remove('flipped', 'shake'); second.classList.remove('flipped', 'shake');
            first = null; second = null; lock = false;
          }, 380);
        }, 550);
      }
    }
    function scoreNow() { return Math.max(0, 1000 - moves * 25); }
    function updateHUD() {
      setHUD('<div class="hud-chip">🔁 จำนวนจับ <span>' + moves + '</span></div><div class="hud-chip">✅ จับคู่แล้ว <span>' + matched + '/' + EMOJIS.length + '</span></div><div class="hud-chip">⭐ คะแนน <span>' + scoreNow() + '</span></div>');
    }
    function win() {
      const score = scoreNow();
      const isBest = saveBest('memory', score);
      sfx('win');
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('🎉 เก่งมาก! จับคู่ครบทุกใบด้วย ' + moves + ' ครั้ง ได้ ' + score + ' แต้ม' + (isBest ? ' 🏆 สถิติใหม่!' : ''));
    }
    function reset(zone) {
      first = null; second = null; lock = false; moves = 0; matched = 0;
      build(zone); updateHUD();
    }
    return {
      setup: function(zone) {
        reset(zone);
        setControls(replayControls('🔄 เปิดการ์ดใหม่'));
        setNote('เกมนี้ใช้เมาส์/นิ้วแตะการ์ดได้เลย ไม่ต้องใช้คีย์บอร์ด');
      },
      start: function() { reset(document.getElementById('stage-zone')); },
      stop: function() {},
      keydown: function() {}
    };
  }();

  /* ---------------- 9. 2048 (DOM) ---------------- */
  GameBuilders.g2048 = function() {
    let grid, cells, score, over;

    function build(zone) {
      zone.innerHTML = '<div class="g2048-wrap"><div class="g2048-grid" id="g2048-grid"></div></div>';
      const gridEl = document.getElementById('g2048-grid');
      gridEl.innerHTML = '';
      for (let i = 0; i < 16; i++) {
        const d = document.createElement('div');
        d.className = 'g2048-cell';
        gridEl.appendChild(d);
      }
      cells = gridEl.querySelectorAll('.g2048-cell');

      /* ปัดหน้าจอเลื่อนเหรียญ */
      let touchStart = null;
      gridEl.addEventListener('pointerdown', function(e) { touchStart = { x: e.clientX, y: e.clientY }; });
      gridEl.addEventListener('pointerup', function(e) {
        if (!touchStart) return;
        const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
      });
    }
    function emptyCells() {
      const out = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) out.push([r, c]);
      return out;
    }
    function addRandom() {
      const ec = emptyCells();
      if (!ec.length) return;
      const p = ec[Math.floor(Math.random() * ec.length)];
      grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
    }
    function render() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const v = grid[r][c];
          const el = cells[r * 4 + c];
          el.className = 'g2048-cell' + (v ? ' v' + Math.min(v, 2048) : '') + (v > 2048 ? ' vbig' : '');
          el.textContent = v ? v : '';
        }
      }
      setHUD('<div class="hud-chip">⭐ คะแนน <span>' + score + '</span></div><div class="hud-chip">🎯 เป้าหมาย <span>2048</span></div>');
    }
    function canMove() {
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        const v = grid[r][c];
        if (c < 3 && grid[r][c + 1] === v) return true;
        if (r < 3 && grid[r + 1][c] === v) return true;
      }
      return false;
    }
    function move(dir) {
      if (over) return;
      let moved = false, gained = 0;
      function slide(row) {
        const arr = row.filter(function(v) { return v; });
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) { arr[i] *= 2; gained += arr[i]; arr.splice(i + 1, 1); }
        }
        while (arr.length < 4) arr.push(0);
        return arr;
      }
      for (let i = 0; i < 4; i++) {
        if (dir === 'ArrowLeft' || dir === 'ArrowRight') {
          let row = grid[i].slice();
          if (dir === 'ArrowRight') row.reverse();
          const ns = slide(row);
          const back = dir === 'ArrowRight' ? ns.slice().reverse() : ns;
          if (back.join() !== grid[i].join()) moved = true;
          grid[i] = back;
        } else {
          let col = [grid[0][i], grid[1][i], grid[2][i], grid[3][i]];
          if (dir === 'ArrowDown') col.reverse();
          const ns = slide(col);
          const back = dir === 'ArrowDown' ? ns.slice().reverse() : ns;
          for (let r = 0; r < 4; r++) { if (back[r] !== grid[r][i]) moved = true; grid[r][i] = back[r]; }
        }
      }
      if (!moved) return;
      score += gained;
      if (gained > 0) sfx('coin'); else sfx('tick');
      addRandom(); render();
      if (grid.some(function(row) { return row.some(function(v) { return v >= 2048; }); })) {
        over = true; saveBest('g2048', score); sfx('win');
        setControls(replayControls('🔄 เริ่มใหม่'));
        setNote('🏆 รวมได้ 2048 แล้ว! คะแนน ' + score.toLocaleString() + ' เก่งมาก');
        return;
      }
      if (emptyCells().length === 0 && !canMove()) {
        over = true; sfx('hit');
        const isBest = saveBest('g2048', score);
        setControls(replayControls('🔄 เริ่มใหม่'));
        setNote('จบเกม! คะแนน ' + score.toLocaleString() + (isBest ? ' 🏆 สถิติใหม่!' : '') + ' • สถิติ ' + (loadBests().g2048 || 0).toLocaleString());
      }
    }
    return {
      setup: function(zone) {
        build(zone);
        grid = Array.from({ length: 4 }, function() { return [0, 0, 0, 0]; });
        score = 0; over = false;
        addRandom(); addRandom(); render();
        setControls(replayControls('🔄 เริ่มใหม่'));
        setupTouchControls(TOUCH_DIRS);
        setNote('ใช้ลูกศร ปุ่มสัมผัสด้านล่าง หรือปัดบนตาราง — ตัวเลขเท่ากันชนกันจะรวมเป็นเลขใหญ่ขึ้น');
      },
      start: function() { this.setup(document.getElementById('stage-zone')); },
      stop: function() {},
      keydown: function(e) {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) move(e.key);
        else if (e.key === 'w') move('ArrowUp');
        else if (e.key === 'a') move('ArrowLeft');
        else if (e.key === 's') move('ArrowDown');
        else if (e.key === 'd') move('ArrowRight');
      }
    };
  }();

  /* ---------------- 10. MOLE WHACK (DOM) ---------------- */
  GameBuilders.mole = function() {
    let holes, score, timeLeft, timer, upTimer, running, hits, bombsHit;

    function build() {
      const zone = document.getElementById('stage-zone');
      zone.innerHTML = '<div class="mole-grid" id="mole-grid"></div>';
      const gridEl = document.getElementById('mole-grid');
      gridEl.innerHTML = '';
      holes = [];
      for (let i = 0; i < 9; i++) {
        const d = document.createElement('div');
        d.className = 'mole-hole';
        d.innerHTML = '<span class="mole-emoji"></span>';
        d.addEventListener('pointerdown', function() { whack(i); });
        gridEl.appendChild(d);
        holes.push(d);
      }
    }
    function popUp() {
      if (!running) return;
      const hole = holes[Math.floor(Math.random() * 9)];
      if (!hole.classList.contains('up')) {
        const isBomb = Math.random() < 0.18;
        hole.classList.toggle('bomb', isBomb);
        hole.querySelector('.mole-emoji').textContent = isBomb ? '💣' : (Math.random() < 0.12 ? '🪙' : '🐹');
        hole.classList.add('up');
        (function(h, bomb) {
          setTimeout(function() { h.classList.remove('up'); }, bomb ? 800 : 700 + Math.random() * 500);
        })(hole, isBomb);
      }
      upTimer = setTimeout(popUp, 320 + Math.random() * 380);
    }
    function whack(i) {
      if (!running) return;
      const hole = holes[i];
      if (!hole.classList.contains('up')) return;
      const emoji = hole.querySelector('.mole-emoji').textContent;
      hole.classList.add('whack');
      setTimeout(function() { hole.classList.remove('whack'); }, 180);
      hole.classList.remove('up');
      if (hole.classList.contains('bomb')) { score = Math.max(0, score - 30); bombsHit++; sfx('hit'); }
      else if (emoji === '🪙') { score += 40; sfx('coin'); }
      else { score += 20; hits++; sfx('coin'); }
      updateHUD();
    }
    function updateHUD() {
      setHUD('<div class="hud-chip">⭐ คะแนน <span>' + score + '</span></div><div class="hud-chip">⏱️ เวลา <span>' + timeLeft + 's</span></div><div class="hud-chip">🔨 ตีโดน <span>' + hits + '</span></div>');
    }
    function finish() {
      running = false;
      clearInterval(timer); clearTimeout(upTimer);
      const isBest = saveBest('mole', score);
      holes.forEach(function(h) { h.classList.remove('up'); });
      setHUD('<div class="hud-chip">⭐ สถิติ <span>' + (loadBests().mole || 0) + '</span></div>');
      setControls(replayControls('🔄 เล่นใหม่'));
      setNote('หมดเวลา! ตีโดน ' + hits + ' ตัว โดนระเบิด ' + bombsHit + ' ครั้ง • คะแนนรวม ' + score + (isBest ? ' 🏆 สถิติใหม่!' : ''));
      sfx('win');
    }
    function clearTimers() { clearInterval(timer); clearTimeout(upTimer); }
    return {
      setup: function() {
        build();
        score = 0; timeLeft = 30; hits = 0; bombsHit = 0; running = false;
        clearTimers(); updateHUD();
        setNote('แตะ 🐹 และ 🪙 เพื่อคะแนน อย่าแตะ 💣 เด็ดขาด! เกมนี้เล่น 30 วินาที');
      },
      start: function() {
        build();
        score = 0; timeLeft = 30; hits = 0; bombsHit = 0; running = true;
        updateHUD();
        clearTimers();
        timer = setInterval(function() { timeLeft--; updateHUD(); if (timeLeft <= 0) finish(); }, 1000);
        popUp();
      },
      stop: function() { running = false; clearTimers(); },
      keydown: function() {}
    };
  }();

  /* ================================================================
     เริ่มต้น
     ================================================================ */
  renderMenu();
</script>
