<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAVINGS ARCADE - กำลังเข้าสู่ระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      font-family: 'Kanit', sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .logo {
      font-family: 'Press Start 2P', cursive;
      font-size: 20px;
      color: #fbf236;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fbf236;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .msg {
      font-size: 16px;
      color: #cbdbfc;
    }
    .manual-link {
      margin-top: 20px;
      font-size: 13px;
      color: #fbf236;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
  <script>
    (function route() {
      try {
        const raw = localStorage.getItem('arcadeSession_v1');
        const s = raw ? JSON.parse(raw) : null;
        if (s && s.phone) {
          location.replace('home.html');
        } else {
          location.replace('login.html');
        }
      } catch (e) {
        location.replace('login.html');
      }
    })();
  </script>
</head>
<body>
  <div class="logo">💰 SAVINGS ARCADE</div>
  <div class="loader"></div>
  <div class="msg">กำลังเข้าสู่ระบบเกม...</div>
  <a class="manual-link" href="login.html">หากไม่เปลี่ยนหน้าอัตโนมัติ คลิกที่นี่เพื่อเข้าสู่ระบบ</a>
</body>
</html>
